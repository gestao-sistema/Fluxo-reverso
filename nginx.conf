# Template do servidor de produção do frontend (Railway).
# O CMD do Dockerfile troca __PORT__ pelo valor da variável PORT injetada pelo Railway.

# Log sem query string: links de convite e recuperação trazem token_hash em /definir-senha?token_hash=...
log_format seguro '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen __PORT__;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout seguro;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Health check do Railway. Responde só se o Nginx está no ar: não testa login, banco nem integrações.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    # Assets com hash do Vite: o nome muda a cada build, então o cache longo é seguro.
    # Arquivo inexistente vira 404, nunca index.html.
    location ^~ /assets/ {
        # Worker do pdf.js (pdf.worker.min-*.mjs). O mime.types padrão do Nginx só mapeia ".js";
        # sem isto o .mjs sai como application/octet-stream e, com nosniff, o navegador recusa o
        # module worker: a leitura do código de rastreio e o "Abrir PDF" deixam de funcionar.
        # "types {}" vale só nesta location; o restante do servidor mantém o mapa padrão.
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rotas de API não existem neste frontend: nunca devolvem index.html.
    location ^~ /api/ {
        return 404;
    }

    # Arquivos ocultos (.git, .env etc.) nunca são servidos.
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Módulos .mjs fora de /assets/: mesmo MIME JavaScript (vem antes da regra genérica abaixo).
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Arquivos com extensão que não existem viram 404, nunca index.html.
    location ~* \.(?:js|css|map|json|txt|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fallback de SPA: rotas internas abrem e atualizam direto. index.html não pode ficar em cache,
    # para que um novo deploy seja percebido logo na próxima visita.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
